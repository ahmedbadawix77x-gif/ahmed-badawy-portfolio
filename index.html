  <style>
    /* SPLASH SCREEN STYLES */
    #splash-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;
      background:radial-gradient(circle at 15% 20%,#DCEBFF 0,transparent 45%),radial-gradient(circle at 85% 15%,#F3E3FF 0,transparent 42%),radial-gradient(circle at 70% 90%,#D5F7EE 0,transparent 45%),radial-gradient(circle at 10% 90%,#FFE8D6 0,transparent 40%),#F8FBFF}
    #splash-screen .sp-blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:sp-drift 9s ease-in-out infinite alternate}
    @keyframes sp-drift{to{transform:translate(30px,-26px) scale(1.12)}}
    #splash-screen .sp-shape{position:absolute;animation:sp-float 7s ease-in-out infinite alternate,sp-in .8s ease both}
    #splash-screen .sp-ring{border:6px solid;border-radius:50%}
    #splash-screen .sp-sq{border-radius:18px;animation-name:sp-spin,sp-in}
    @keyframes sp-spin{to{transform:rotate(360deg)}}
    @keyframes sp-float{from{transform:translateY(0) rotate(0)}to{transform:translateY(-22px) rotate(12deg)}}
    @keyframes sp-in{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
    #splash-screen .sp-icon{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:16px;display:grid;place-items:center;background:#fff;border:1px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 12px 26px -12px color-mix(in srgb,var(--c) 60%,transparent);animation:sp-pop .7s cubic-bezier(.34,1.56,.64,1) var(--d) both,sp-bob var(--f) ease-in-out calc(var(--d) + .7s) infinite alternate}
    #splash-screen .sp-icon b{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:800}
    @keyframes sp-pop{from{opacity:0;transform:scale(.2) translateY(30px)}to{opacity:1;transform:none}}
    @keyframes sp-bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(5deg)}}
    .splash-photo-ring{position:relative;z-index:2;width:150px;height:150px;margin-bottom:26px;animation:splash-enter .9s cubic-bezier(.34,1.56,.64,1) .2s both}
    @keyframes splash-enter{from{opacity:0;transform:scale(.5) translateY(24px)}to{opacity:1;transform:none}}
    .splash-ring-outer{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#3B82F6,#8B5CF6,#EC4899,#F59E0B,#10B981,#06B6D4,#3B82F6);animation:spin 3.5s linear infinite}
    .splash-ring-pulse{position:absolute;inset:-8px;border-radius:50%;border:2px solid #3B82F6;animation:sp-pulse 2s ease-out infinite}
    @keyframes sp-pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.6);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .splash-ring-gap{position:absolute;inset:-4px;border-radius:50%;background:#fff}
    .splash-photo-wrap{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;z-index:1;box-shadow:0 18px 40px -16px rgba(37,99,235,.5)}
    .splash-photo{width:100%;height:100%;object-fit:cover;transform:scale(1.42);transform-origin:50% 22%}
    .splash-name{position:relative;z-index:2;font-size:2.2rem;font-weight:800;color:#0F2A5F;letter-spacing:-.02em;text-align:center;animation:splash-text .7s ease .5s both}
    .splash-name span{background:linear-gradient(135deg,#2563EB,#8B5CF6,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .splash-title{position:relative;z-index:2;font-size:.78rem;font-weight:700;color:#475569;letter-spacing:.15em;text-transform:uppercase;text-align:center;margin-top:6px;padding:0 16px;animation:splash-text .7s ease .7s both}
    @keyframes splash-text{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .splash-progress-wrap{position:relative;z-index:2;width:220px;height:5px;background:rgba(37,99,235,.12);border-radius:999px;margin-top:30px;overflow:hidden;animation:splash-text .5s ease .9s both}
    .splash-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#3B82F6,#8B5CF6,#EC4899,#F59E0B);width:0;animation:progress-fill 1.8s cubic-bezier(.4,0,.2,1) .8s forwards}
    @keyframes progress-fill{0%{width:0}60%{width:75%}100%{width:100%}}
    #splash-screen.fade-out{animation:splash-fade-out .7s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
    #splash-screen.fade-out .splash-photo-ring{transition:transform .7s;transform:scale(1.15)}
    @keyframes splash-fade-out{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(1.06);filter:blur(8px)}}
    @media(max-width:640px){#splash-screen .sp-icon{width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:13px}#splash-screen .sp-icon svg{width:21px;height:21px}.splash-name{font-size:1.8rem}.sp-hide-m{display:none}}
  </style>
