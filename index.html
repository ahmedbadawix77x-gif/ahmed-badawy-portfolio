  <style>
    /* SPLASH SCREEN STYLES */
    #splash-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 50% 42%,#FFFFFF 0,#F6F9FE 70%)}
    #splash-screen .sp-ring{position:absolute;left:50%;top:42%;border-radius:50%;border:1px solid rgba(37,99,235,.14);transform:translate(-50%,-50%);animation:sp-ringin 1s ease both}
    @keyframes sp-ringin{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
    #splash-screen .sp-icon{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:16px;display:grid;place-items:center;background:#fff;border:1px solid color-mix(in srgb,var(--c) 22%,white);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 9%,transparent),0 0 30px color-mix(in srgb,var(--c) 42%,transparent);animation:sp-pop .6s cubic-bezier(.34,1.4,.64,1) var(--d) both,sp-bob var(--f) ease-in-out calc(var(--d) + .6s) infinite alternate}
    @keyframes sp-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
    @keyframes sp-bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
    .splash-photo-ring{position:relative;z-index:2;width:140px;height:140px;margin-bottom:24px;animation:splash-enter .7s cubic-bezier(.34,1.4,.64,1) .1s both}
    @keyframes splash-enter{from{opacity:0;transform:scale(.7) translateY(16px)}to{opacity:1;transform:none}}
    .splash-ring-outer{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#3776AB,#FFD43B,#F05032,#2496ED,#3776AB);animation:spin 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .splash-ring-gap{position:absolute;inset:-3px;border-radius:50%;background:#fff}
    .splash-photo-wrap{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;z-index:1;box-shadow:0 14px 30px -14px rgba(15,42,95,.45)}
    .splash-photo{width:100%;height:100%;object-fit:cover;transform:scale(1.42);transform-origin:50% 22%}
    .splash-name{position:relative;z-index:2;font-size:2.1rem;font-weight:800;color:#0F2A5F;letter-spacing:-.02em;text-align:center;animation:splash-text .6s ease .35s both}
    .splash-name span{color:#2563EB}
    .splash-title{position:relative;z-index:2;font-size:.76rem;font-weight:700;color:#64748B;letter-spacing:.15em;text-transform:uppercase;text-align:center;margin-top:6px;padding:0 16px;animation:splash-text .6s ease .5s both}
    @keyframes splash-text{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .splash-progress-wrap{position:relative;z-index:2;width:200px;height:4px;background:rgba(37,99,235,.1);border-radius:999px;margin-top:28px;overflow:hidden;animation:splash-text .5s ease .6s both}
    .splash-progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#3776AB,#2496ED,#FFD43B);width:0;animation:progress-fill 1.5s cubic-bezier(.4,0,.2,1) .6s forwards}
    @keyframes progress-fill{0%{width:0}60%{width:75%}100%{width:100%}}
    #splash-screen.fade-out{animation:splash-fade-out .5s ease forwards;pointer-events:none}
    @keyframes splash-fade-out{to{opacity:0;transform:scale(1.03)}}
    @media(max-width:640px){#splash-screen .sp-icon{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:13px}#splash-screen .sp-icon svg{width:22px;height:22px}.splash-name{font-size:1.8rem}#splash-screen .sp-hide-m{display:none}}
  </style>
