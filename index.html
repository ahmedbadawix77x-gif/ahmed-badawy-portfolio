  <style>
    /* ============================
         SPLASH SCREEN STYLES
         ============================ */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1628;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Animated gradient background */
    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.20) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(6, 182, 212, 0.10) 0%, transparent 50%);
      animation: splash-bg 4s ease-in-out infinite alternate;
    }

    @keyframes splash-bg {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }

      100% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    /* Grid overlay */
    #splash-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: grid-fade 1s ease-in forwards;
    }

    @keyframes grid-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Photo ring */
    .splash-photo-ring {
      position: relative;
      z-index: 1;
      width: 140px;
      height: 140px;
      margin-bottom: 28px;
      animation: splash-enter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes splash-enter {
      from {
        opacity: 0;
        transform: scale(0.6) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .splash-ring-outer {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #3B82F6, #6366F1, #06B6D4, #10B981, #3B82F6);
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .splash-ring-gap {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: #0a1628;
    }

    .splash-photo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      z-index: 1;
    }

    /* Text content */
    .splash-name {
      position: relative;
      z-index: 1;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      text-align: center;
      animation: splash-text 0.7s ease 0.5s both;
    }

    .splash-name span {
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-title {
      position: relative;
      z-index: 1;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(148, 163, 184, 0.9);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      margin-top: 6px;
      animation: splash-text 0.7s ease 0.7s both;
    }

    @keyframes splash-text {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Progress bar */
    .splash-progress-wrap {
      position: relative;
      z-index: 1;
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      margin-top: 32px;
      overflow: hidden;
      animation: splash-text 0.5s ease 0.9s both;
    }

    .splash-progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3B82F6, #06B6D4, #6366F1);
      animation: progress-fill 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
      width: 0%;
    }

    @keyframes progress-fill {
      0% {
        width: 0%;
      }

      60% {
        width: 75%;
      }

      100% {
        width: 100%;
      }
    }

    /* Floating particles */
    .splash-particle {
      position: absolute;
      border-radius: 50%;
      animation: float-particle linear infinite;
      z-index: 0;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-20vh) scale(1);
        opacity: 0;
      }
    }

    /* Fade out */
    #splash-screen.fade-out {
      animation: splash-fade-out 0.6s cubic-bezier(0.4, 0, 1, 1) forwards;
      pointer-events: none;
    }

    @keyframes splash-fade-out {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.03);
      }
    }
  </style>
</head>

<body
  class="bg-[#F8FBFF] text-slate-800 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-blue-500 selection:text-white">

  <!-- ============================
         SPLASH SCREEN
         ============================ -->
  <div id="splash-screen">

    <!-- Floating particles -->
    <div class="splash-particle"
      style="width:4px;height:4px;background:#3B82F6;left:15%;animation-duration:6s;animation-delay:0s;"></div>
    <div class="splash-particle"
      style="width:3px;height:3px;background:#6366F1;left:30%;animation-duration:8s;animation-delay:1s;"></div>
    <div class="splash-particle"
      style="width:5px;height:5px;background:#06B6D4;left:50%;animation-duration:7s;animation-delay:0.5s;"></div>
    <div class="splash-particle"

    <div class="splash-particle"
      style="width:4px;height:4px;background:#3B82F6;left:80%;animation-duration:6.5s;animation-delay:0.3s;"></div>
    <div class="splash-particle"
      style="width:2px;height:2px;background:#6366F1;left:90%;animation-duration:7.5s;animation-delay:2s;"></div>
    <div class="splash-particle"

    <!-- Photo -->

    <!-- Name & Title -->
    <div class="splash-name">Ahmed <span>Badawy</span></div>

    <!-- Progress bar -->
    <div class="splash-progress-wrap">
      <div class="splash-progress-bar"></div>
    </div>

  </div>

  <!-- App Root -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Splash hide logic -->
  <script>
    (function () {
      var splash = document.getElementById('splash-screen');
      // Hide after ~2.6s (progress bar finishes + small buffer)
      setTimeout(function () {
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function () {
            splash.style.display = 'none';
          }, 650);
        }
      }, 2600);
    })();
  </script>
</body>
